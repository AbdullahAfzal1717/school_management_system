services:
  postgres:
    image: postgres:16-alpine
    container_name: school_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: school_management
    ports:
      - "5432:5432"
    volumes:
      - school_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school_management_postgres_data:
